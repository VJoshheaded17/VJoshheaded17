[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "georag-vlm"
version = "0.1.0"
description = "Experimental satellite captioning, retrieval, and paired RAG evaluation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
models = ["torch>=2.2,<3", "transformers>=4.45,<5", "sentence-transformers>=3,<6", "Pillow>=10,<13", "numpy>=1.26,<3"]
retrieval = ["qdrant-client>=1.12,<2", "faiss-cpu>=1.8,<2", "numpy>=1.26,<3"]
evaluation = ["nltk>=3.9,<4"]
notebooks = ["jupyterlab>=4,<5"]

[project.scripts]
georag = "georag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
