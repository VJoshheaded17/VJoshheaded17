name: KNN and decision tree checks

on:
  push:
    paths:
      - 'KNN-and-Decision-Trees/**'
      - '.github/workflows/classical-ml.yml'
  pull_request:
    paths:
      - 'KNN-and-Decision-Trees/**'
      - '.github/workflows/classical-ml.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KNN-and-Decision-Trees
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python experiments.py all --knn-repeats 2 --tree-repeats 2 --output runs/ci
