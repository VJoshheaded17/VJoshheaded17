name: Image stitching checks
on:
  push:
    paths: ['Image-Stitching/**', '.github/workflows/stitching-checks.yml']
  pull_request:
    paths: ['Image-Stitching/**', '.github/workflows/stitching-checks.yml']
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Image-Stitching/requirements.txt
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
        working-directory: Image-Stitching
      - run: python prepare_assets.py
        working-directory: Image-Stitching
      - run: python -m unittest discover -s tests -v
        working-directory: Image-Stitching
